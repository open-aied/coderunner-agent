# CodeRunner Agent — Apache reverse proxy rules
#
# Add these lines inside the <VirtualHost *:443> block in
# /etc/apache2/sites-available/default-ssl.conf
#
# The /api/ rule MUST come before the Moodle rule (more-specific path first).
# The Moodle ProxyPass preserves the /coderunner-agent/ prefix so that
# Moodle sees the full path and can match it against $CFG->wwwroot.

                # /coderunner-agent to Docker
                ProxyPreserveHost On
                RedirectMatch ^/coderunner-agent$ /coderunner-agent/
                ProxyPass /coderunner-agent/api/ http://127.0.0.1:8083/
                ProxyPassReverse /coderunner-agent/api/ http://127.0.0.1:8083/
                ProxyPass /coderunner-agent/ http://127.0.0.1:8003/coderunner-agent/
                ProxyPassReverse /coderunner-agent/ http://127.0.0.1:8003/coderunner-agent/
